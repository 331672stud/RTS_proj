services:
  rts:
    build:
      context: .
      dockerfile: Dockerfile.RTS
    volumes:
      - ./proj:/workspace/proj
      - rts_build:/workspace/build
    working_dir: /workspace/proj
    command: tail -f /dev/null
    networks:
      - app-net

  sim:
    build:
      context: .
      dockerfile: Dockerfile.Sim
    volumes:
      - ./proj/simScript:/app
      - ./maps:/app/maps
    working_dir: /app
    command: tail -f /dev/null
    stdin_open: true
    tty: true
    depends_on:
      - rts
    networks:
      - app-net

volumes:
  rts_build:

networks:
  app-net:
    driver: bridge
